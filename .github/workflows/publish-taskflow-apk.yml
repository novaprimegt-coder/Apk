name: Publicar TaskFlow APK oficial

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-taskflow-apk.yml"
      - "TaskFlow-latest.json"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar y verificar APK oficial
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="8d35d8a507289f7d2d697425e640e21ee7e8706707609f3d1db61599a8268754"
          EXPECTED_SIZE="35375741"
          URLS=(
            "https://apk.e-droid.net/apk/app4177945-b0jfe2.apk?v=6"
            "https://apk.e-droid.net/apk/app4177945-b0jfe2.apk"
          )

          ok=0
          for URL in "${URLS[@]}"; do
            rm -f TaskFlow.apk
            echo "Probando: $URL"
            if curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 600 -A "Mozilla/5.0" "$URL" -o TaskFlow.apk; then
              ACTUAL_SIZE="$(stat -c%s TaskFlow.apk)"
              ACTUAL_SHA="$(sha256sum TaskFlow.apk | awk '{print $1}')"
              echo "size=$ACTUAL_SIZE sha256=$ACTUAL_SHA"
              if [ "$ACTUAL_SIZE" = "$EXPECTED_SIZE" ] && [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
                ok=1
                break
              fi
            fi
          done

          if [ "$ok" != "1" ]; then
            echo "::error::La APK descargada no coincide exactamente con la APK aprobada. No se publicará."
            exit 1
          fi

      - name: Reemplazar APK estable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload stable TaskFlow.apk --clobber --repo "${{ github.repository }}"

      - name: Verificación final
        shell: bash
        run: |
          set -euo pipefail
          sha256sum TaskFlow.apk
          stat -c%s TaskFlow.apk
